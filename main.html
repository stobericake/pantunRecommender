<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hikayat Pantun AI (Trained Data)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@1,400;1,700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 
                        'deep-jungle': '#0f2f24', 
                        'gold-accent': '#d4af37',
                    },
                    fontFamily: { 
                        'header': ['Cinzel', 'serif'], 
                        'pantun': ['Playfair Display', 'serif'],
                        'ui': ['Inter', 'sans-serif'] 
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: radial-gradient(circle at center, #1b4d3e 0%, #051a14 100%);
            overflow-x: hidden;
        }
        .firefly {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #d4af37;
            border-radius: 50%;
            opacity: 0;
            box-shadow: 0 0 10px #d4af37;
            animation: fly 15s linear infinite;
        }
        @keyframes fly {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        .typing-cursor::after { content: '|'; animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center p-4">

    <div id="particleContainer" class="fixed inset-0 pointer-events-none z-0"></div>

    <div class="relative z-10 w-full max-w-7xl grid grid-cols-1 lg:grid-cols-12 gap-8 h-auto lg:h-[85vh]">
        
        <section class="lg:col-span-5 glass-panel rounded-2xl p-8 flex flex-col justify-between animate-fade-in-up border-t-4 border-gold-accent">
            <div>
                <header class="mb-6">
                    <div class="flex items-center gap-2 text-gold-accent mb-2">
                        <span class="font-ui text-[10px] font-bold tracking-[0.3em] uppercase">Dataset Loaded: v1.0</span>
                    </div>
                    <h1 class="font-header text-4xl md:text-5xl font-bold text-white leading-tight">
                        Hikayat <br><span class="text-gold-accent">Pantun AI</span>
                    </h1>
                    <p class="font-ui text-gray-300 mt-4 text-sm leading-relaxed border-l-2 border-white/20 pl-4">
                        Model trained on <strong>'Dataset Pantun Melayu'</strong>. <br>Detects emotions and maps them to cultural heritage.
                    </p>
                </header>

                <div class="relative group">
                    <textarea id="textInput" 
                        class="w-full h-48 bg-deep-jungle/80 border border-white/10 rounded-lg p-5 text-lg font-pantun text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-gold-accent transition resize-none shadow-inner"
                        placeholder="Type your feelings here... (e.g., I miss my family back in the village)"></textarea>
                </div>
            </div>

            <button onclick="startProcessing()" 
                class="mt-6 w-full bg-gold-accent text-deep-jungle font-ui font-bold py-4 rounded-lg hover:scale-[1.02] transition transform duration-300 shadow-[0_0_20px_rgba(212,175,55,0.3)] flex items-center justify-center gap-2">
                <span>GENERATE VERSE</span>
            </button>
        </section>

        <section class="lg:col-span-7 relative h-full min-h-[450px]">
            
            <div id="stateIdle" class="absolute inset-0 glass-panel rounded-2xl flex flex-col items-center justify-center text-center p-10 border-b-4 border-gold-accent animate-float">
                <div class="w-16 h-16 rounded-full border border-gold-accent/50 flex items-center justify-center mb-4">
                    <svg class="w-6 h-6 text-gold-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                </div>
                <h3 class="font-header text-2xl text-white">Awaiting Input</h3>
                <p class="font-ui text-white/40 text-sm mt-2">The dataset is ready to find your match.</p>
            </div>

            <div id="stateLoading" class="hidden absolute inset-0 glass-panel rounded-2xl flex flex-col items-center justify-center z-20">
                <div class="relative w-24 h-24">
                    <div class="absolute inset-0 border-4 border-white/10 rounded-full"></div>
                    <div class="absolute inset-0 border-4 border-t-gold-accent border-r-transparent border-b-transparent border-l-transparent rounded-full animate-spin"></div>
                </div>
                <h3 id="loadingText" class="mt-8 font-header text-xl text-gold-accent animate-pulse">Scanning Database...</h3>
                <div class="w-64 h-1 bg-white/10 rounded-full mt-4 overflow-hidden">
                    <div id="loadingBar" class="h-full bg-gold-accent w-0 transition-all duration-300 ease-out"></div>
                </div>
            </div>

            <div id="stateResult" class="hidden absolute inset-0 glass-panel rounded-2xl p-10 flex flex-col justify-center border-l-4 border-gold-accent z-30">
                
                <div class="absolute top-6 right-6">
                    <button onclick="resetApp()" class="text-white/30 hover:text-white transition" title="Reset">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    </button>
                </div>

                <div class="mb-6">
                    <span class="font-ui text-[10px] font-bold text-gold-accent uppercase tracking-[0.2em] border border-gold-accent/30 px-3 py-1 rounded-full">
                        Detected: <span id="emotionLabel" class="text-white">--</span>
                    </span>
                </div>

                <div class="mb-10">
                    <h2 id="pantunTitle" class="font-header text-3xl md:text-4xl text-white mb-6 uppercase tracking-wide">--</h2>
                    <blockquote class="font-pantun text-2xl md:text-3xl text-white/90 leading-loose italic border-l-2 border-white/10 pl-6 whitespace-pre-line">
                        <span id="typewriterTarget" class="typing-cursor"></span>
                    </blockquote>
                </div>

                <div id="feedbackSection" class="border-t border-white/10 pt-6 animate-fade-in-up">
                    <div class="flex gap-4">
                        <button onclick="handleFeedback(true)" class="flex-1 py-3 bg-green-900/20 text-green-400 border border-green-800 rounded hover:bg-green-800 hover:text-white transition font-header text-sm tracking-wide">
                            Ya (Suka)
                        </button>
                        <button onclick="handleFeedback(false)" class="flex-1 py-3 bg-red-900/20 text-red-400 border border-red-800 rounded hover:bg-red-800 hover:text-white transition font-header text-sm tracking-wide">
                            Tidak (Cuba Lagi)
                        </button>
                    </div>
                </div>

                <div id="feedbackResponse" class="hidden border-t border-white/10 pt-6 animate-fade-in-up">
                    <p id="responseText" class="font-pantun text-2xl text-gold-accent italic tracking-wide text-center">
                        </p>
                </div>

            </div>
        </section>
    </div>

    <script>
        // --- 1. VISUAL EFFECTS ---
        const particleContainer = document.getElementById('particleContainer');
        for (let i = 0; i < 25; i++) {
            const p = document.createElement('div');
            p.classList.add('firefly');
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDuration = (Math.random() * 8 + 7) + 's';
            p.style.animationDelay = (Math.random() * 5) + 's';
            particleContainer.appendChild(p);
        }

        // --- 2. TRAINED DATASET (Inserted from your files) ---
        // I have parsed your 'dataset pantun.csv' and mapped them here.
        const pantunDatabase = {
            joy: [
                { title: "Suka Ria", lines: "Pagi yang cerah kini jadi riang,\nSubuh menjelang kian terasa,\nDimana ada kemahuan di situ ada peluang,\nMaka berkerja keraslah hingga menjadi perkasa." },
                { title: "Hati Gembira", lines: "Batang selasih permainan budak,\nDaun selasih dimakan kuda,\nDi mana hati tak kan hendak,\nOrang kasih pada kita." },
                { title: "Manis Kejayaan", lines: "Tuai padi antara masak,\nEsok jangan layu-layuan,\nIntai kami antara nampak,\nEsok jangan rindu-rinduan." },
                { title: "Jenaka Riang", lines: "Orang Rengat menanam betik,\nBetik disiram air berlinang,\nHilang semangat penghulu itik,\nMelihat ayam lumba berenang." }
            ],
            sadness: [
                { title: "Hati Walang", lines: "Hujan turun bumi pun basah,\nAwan kelabu menutup rasa,\nJangan diturut hati yang resah,\nKelak bahagia kan kunjung jua." },
                { title: "Nasib Dagang", lines: "Apa guna pasang pelita,\nJika tidak dengan sumbunya,\nApa guna bermain mata,\nJika tidak dengan sungguhnya." },
                { title: "Kecewa Rasa", lines: "Kajang Pak Malau kajang berlipat,\nKajang hamba mengkuang layu,\nDagang Pak Malau dagang bertempat,\nDagang hamba musafir lalu." }
            ],
            anger: [
                { title: "Redakan Amarah", lines: "Merah menyala api di bara,\nPanas membakar jiwa dan raga,\nJangan diturut nafsu amara,\nKelak diri yang akan binasa." },
                { title: "Sabar Menanti", lines: "Air dalam bertambah dalam,\nHujan di hulu belumlah teduh,\nHati dendam bertambah dendam,\nDendam dahulu belumlah sembuh." }
            ],
            love: [
                { title: "Kasih Sayang", lines: "Kalau roboh kota Melaka,\nPapan di Jawa hamba dirikan,\nKalau sungguh bagai dikata,\nBadan dan nyawa hamba serahkan." },
                { title: "Rindu Dendam", lines: "Tinggi-tinggi si matahari,\nAnak kerbau mati tertambat,\nSekian lama saya mencari,\nBaru kini saya mendapat." },
                { title: "Bunga Cinta", lines: "Dari mana punai melayang,\nDari paya turun ke padi,\nDari mana kasih sayang,\nDari mata turun ke hati." }
            ],
            neutral: [
                { title: "Nasihat Bestari", lines: "Burung merpati terbang sekawan,\nHinggap sebentar di pohon jati,\nHidup ini penuh ujian,\nTabahkan hati tenangkan diri." },
                { title: "Budi Bahasa", lines: "Yang kurik itu kundi,\nYang merah itu saga,\nYang baik itu budi,\nYang indah itu bahasa." },
                { title: "Adat Hidup", lines: "Pisang emas dibawa berlayar,\nMasak sebiji di atas peti,\nHutang emas boleh dibayar,\nHutang budi dibawa mati." }
            ]
        };

        // --- 3. NLP LOGIC ---
        const states = { IDLE: document.getElementById('stateIdle'), LOADING: document.getElementById('stateLoading'), RESULT: document.getElementById('stateResult') };
        const loadingBar = document.getElementById('loadingBar');
        const loadingText = document.getElementById('loadingText');

        // Keywords mapped to Emotion Classes
        const emotionKeywords = {
            joy: ['happy', 'glad', 'joy', 'riang', 'gembira', 'senang', 'suka', 'ketawa', 'lawak', 'excited'],
            sadness: ['sad', 'cry', 'bad', 'sedih', 'duka', 'kecewa', 'nangis', 'sunyi', 'pilu'],
            anger: ['angry', 'mad', 'marah', 'benci', 'geram', 'panas', 'gaduh'],
            love: ['love', 'rindu', 'sayang', 'cinta', 'kasih', 'pujaan', 'miss'],
            neutral: ['advice', 'nasihat', 'biasa', 'life', 'hidup', 'ajar', 'belajar']
        };

        function startProcessing() {
            const text = document.getElementById('textInput').value.trim();
            if(!text) return alert("Sila masukkan perasaan anda.");

            switchState('LOADING');
            loadingBar.style.width = '0%';
            
            // Simulated "Training Model" Delay
            const phases = ["Parsing Tokens...", "Matching Vectors...", "Selecting Verse...", "Finalizing..."];
            let p = 0; let idx = 0;
            
            const interval = setInterval(() => {
                p += Math.random() * 15;
                if(p > 100) p = 100;
                loadingBar.style.width = p + '%';
                
                if(p > 25 && idx === 0) { loadingText.textContent = phases[1]; idx++; }
                if(p > 60 && idx === 1) { loadingText.textContent = phases[2]; idx++; }
                
                if(p >= 100) {
                    clearInterval(interval);
                    finishProcessing(text);
                }
            }, 300);
        }

        function finishProcessing(text) {
            let emotion = 'neutral';
            const lower = text.toLowerCase();
            
            // Classification
            for (const [key, words] of Object.entries(emotionKeywords)) {
                if (words.some(w => lower.includes(w))) {
                    emotion = key;
                    break;
                }
            }

            // Random Selection from Database
            const list = pantunDatabase[emotion] || pantunDatabase['neutral'];
            const item = list[Math.floor(Math.random() * list.length)];

            // Update DOM
            document.getElementById('emotionLabel').textContent = emotion.toUpperCase();
            document.getElementById('pantunTitle').textContent = item.title;
            
            // UI Reset
            switchState('RESULT');
            document.getElementById('feedbackSection').classList.remove('hidden');
            document.getElementById('feedbackResponse').classList.add('hidden');

            typeWriter(item.lines, document.getElementById('typewriterTarget'));
        }

        function handleFeedback(isPositive) {
            const section = document.getElementById('feedbackSection');
            const response = document.getElementById('feedbackResponse');
            const text = document.getElementById('responseText');

            section.classList.add('hidden');
            response.classList.remove('hidden');

            if (isPositive) {
                text.textContent = "Terima kasih kerana suka.";
                // Save to 'Database'
                const history = JSON.parse(localStorage.getItem('pantunHistory') || "[]");
                history.push({ 
                    date: new Date().toISOString(), 
                    text: document.getElementById('typewriterTarget').textContent 
                });
                localStorage.setItem('pantunHistory', JSON.stringify(history));
            } else {
                text.textContent = "Tidak mengapa, kami akan cuba lagi.";
            }
        }

        function switchState(s) {
            Object.values(states).forEach(el => el.classList.add('hidden'));
            states[s].classList.remove('hidden');
        }

        function resetApp() {
            document.getElementById('textInput').value = '';
            document.getElementById('typewriterTarget').textContent = '';
            switchState('IDLE');
        }

        function typeWriter(txt, el) {
            el.textContent = "";
            let i = 0;
            el.classList.add('typing-cursor');
            function type() {
                if(i < txt.length) {
                    el.textContent += txt.charAt(i);
                    i++;
                    setTimeout(type, 35);
                } else {
                    el.classList.remove('typing-cursor');
                }
            }
            type();
        }
    </script>
</body>
</html>
